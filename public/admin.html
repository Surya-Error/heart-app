<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#ff416c,#ff4b2b,#ff0080);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
overflow-x:hidden;
color:white;
}

@keyframes bgMove{
0%{background-position:left}
100%{background-position:right}
}

header{
padding:20px;
text-align:center;
font-size:28px;
font-weight:700;
letter-spacing:1px;
}

.dashboard{
max-width:1200px;
margin:auto;
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
background:rgba(255,255,255,0.2);
}

.card h2{
font-size:32px;
margin-top:10px;
}

.searchBox{
margin-bottom:15px;
}

.searchBox input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
}

.tableBox{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:15px;
padding:15px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
text-align:center;
}

th{
background:rgba(255,255,255,0.2);
}

tr:nth-child(even){
background:rgba(255,255,255,0.05);
}

button{
padding:6px 12px;
border:none;
border-radius:6px;
background:#ff2e63;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff004c;
transform:scale(1.05);
}

/* floating hearts */

.heart{
position:fixed;
bottom:-20px;
font-size:20px;
animation:floatHeart 8s linear infinite;
opacity:0.7;
}

@keyframes floatHeart{
0%{
transform:translateY(0) rotate(0);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-100vh) rotate(360deg);
opacity:0;
}
}

</style>
</head>

<body>

<header>💘 Love App Admin Dashboard</header>

<div class="dashboard">

<div class="cards">
<div class="card">
<div>Total Entries</div>
<h2 id="totalCount">0</h2>
</div>

<div class="card">
<div>Love Messages</div>
<h2 id="messageCount">0</h2>
</div>

<div class="card">
<div>Proposals</div>
<h2 id="proposalCount">0</h2>
</div>
</div>

<div class="searchBox">
<input type="text" id="searchInput" placeholder="Search by name...">
</div>

<div class="tableBox">
<table id="dataTable">

<thead>
<tr>
<th>ID</th>
<th>Your Name</th>
<th>Crush Name</th>
<th>Message</th>
<th>Score</th>
<th>Proposal</th>
<th>Action</th>
</tr>
</thead>

<tbody></tbody>

</table>
</div>

</div>

<script>

let allData=[]

function loadData(){

fetch("/admin",{
headers:{
"admin-password":"admin123"
}
})
.then(res=>res.json())
.then(data=>{

allData=data

renderTable(data)

document.getElementById("totalCount").innerText=data.length
document.getElementById("messageCount").innerText=data.filter(d=>d.heart_message).length
document.getElementById("proposalCount").innerText=data.filter(d=>d.proposal).length

})

}

function renderTable(data){

let rows=""

data.forEach(item=>{

rows+=`
<tr>
<td>${item.id}</td>
<td>${item.your_name}</td>
<td>${item.crush_name}</td>
<td>${item.heart_message}</td>
<td>${item.love_score}</td>
<td>${item.proposal}</td>
<td>
<button onclick="deleteEntry(${item.id})">Delete</button>
</td>
</tr>
`

})

document.querySelector("tbody").innerHTML=rows

}

function deleteEntry(id){

fetch("/delete/"+id,{
method:"DELETE",
headers:{
"admin-password":"admin123"
}
})
.then(()=>loadData())

}

document.getElementById("searchInput").addEventListener("keyup",function(){

let value=this.value.toLowerCase()

let filtered=allData.filter(item=>
item.your_name.toLowerCase().includes(value) ||
item.crush_name.toLowerCase().includes(value)
)

renderTable(filtered)

})

loadData()

/* floating hearts generator */

setInterval(()=>{

let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"

heart.style.left=Math.random()*100+"%"
heart.style.fontSize=(Math.random()*20+10)+"px"

document.body.appendChild(heart)

setTimeout(()=>{
heart.remove()
},8000)

},500)

</script>

</body>
</html>
```
