<!DOCTYPE html>
<html>
<head>

<title>Love Admin Dashboard</title>

<style>

*{
box-sizing:border-box;
font-family:sans-serif;
}

body{
margin:0;
background:linear-gradient(135deg,#ff416c,#ff4b2b,#ff0080);
color:white;
min-height:100vh;
}

/* header */

header{
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
}

/* cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.card{

background:rgba(255,255,255,0.15);

padding:20px;

border-radius:15px;

text-align:center;

backdrop-filter:blur(10px);

box-shadow:0 10px 30px rgba(0,0,0,0.3);

}

.card h2{
margin-top:10px;
font-size:32px;
}

/* table */

.tableBox{

margin:20px;

background:rgba(255,255,255,0.15);

border-radius:15px;

padding:20px;

overflow:auto;

}

table{

width:100%;

border-collapse:collapse;

}

th,td{

padding:12px;

text-align:center;

}

th{

background:rgba(255,255,255,0.25);

}

tr:nth-child(even){

background:rgba(255,255,255,0.05);

}

button{

padding:6px 12px;

border:none;

border-radius:6px;

background:#ff2e63;

color:white;

cursor:pointer;

}

button:hover{

background:#ff004c;

}

</style>

</head>

<body>

<header>💘 Love Admin Dashboard</header>

<div class="cards">

<div class="card">

<div>Total Entries</div>

<h2 id="total">0</h2>

</div>

<div class="card">

<div>Perfect Couples</div>

<h2 id="perfect">0</h2>

</div>

<div class="card">

<div>Try Again</div>

<h2 id="retry">0</h2>

</div>

</div>

<div class="tableBox">

<table>

<thead>

<tr>

<th>ID</th>

<th>Your Name</th>

<th>Crush</th>

<th>Message</th>

<th>Score</th>

<th>Proposal</th>

<th>Action</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

function loadData(){

fetch("/admin")

.then(res=>res.json())

.then(data=>{

document.getElementById("total").innerText=data.length

document.getElementById("perfect").innerText=data.filter(d=>d.love_score>70).length

document.getElementById("retry").innerText=data.filter(d=>d.love_score<=70).length

let rows=""

data.forEach(item=>{

rows+=`

<tr>

<td>${item.id}</td>

<td>${item.your_name}</td>

<td>${item.crush_name}</td>

<td>${item.heart_message}</td>

<td>${item.love_score}</td>

<td>${item.proposal}</td>

<td>

<button onclick="deleteEntry(${item.id})">

Delete

</button>

</td>

</tr>

`

})

document.getElementById("tableBody").innerHTML=rows

})

}

function deleteEntry(id){

fetch("/delete/"+id,{method:"DELETE"})

.then(()=>loadData())

}

loadData()

</script>

<script>

function loadData(){

fetch("/admin")
.then(res=>res.json())
.then(data=>{

let rows=""

data.forEach(item=>{

rows+=`
<tr>

<td>${item.id}</td>
<td>${item.your_name}</td>
<td>${item.crush_name}</td>
<td>${item.heart_message}</td>
<td>${item.love_score}%</td>
<td>${item.proposal}</td>

<td>
<button onclick="deleteEntry(${item.id})">
Delete
</button>
</td>

</tr>
`

})

document.getElementById("tableData").innerHTML=rows

})

}

function deleteEntry(id){

fetch("/delete/"+id,{
method:"DELETE"
})
.then(()=>{
loadData()
})

}

loadData()

</script>

</body>

</html>
